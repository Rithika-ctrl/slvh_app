name: slvh_app
description: "SLVH Smart Shop"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^19.5.0
  go_router: ^15.1.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  image_picker: ^1.0.8
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  fl_chart: 0.66.2
  data_table_2: 2.3.12
  csv: ^6.0.0
  intl: ^0.19.0
  file_saver: ^0.2.8
  uuid: ^4.4.0
  webview_flutter: ^4.10.0           # Feature 10: Privacy Policy / Terms WebView

  # ── Feature 11: Offline / No Internet Handling ─────────────────────────
  connectivity_plus: ^6.1.0          # Detects wifi / mobile / none
  hive_flutter: ^1.1.0               # Lightweight local key-value box for write queue
  # hive is a transitive dependency of hive_flutter; no need to list separately

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1             # Only needed if you later add @HiveType adapters
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
