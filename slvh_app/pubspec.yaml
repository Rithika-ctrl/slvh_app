name: slvh_app
description: "SLVH Smart Shop"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.2.0   
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^5.1.0
  http: ^1.2.2
  crypto: ^3.0.3
  flutter_local_notifications: ^19.5.0
  go_router: ^15.1.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  image_picker: ^1.0.8
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  fl_chart: 0.66.2
  data_table_2: 2.3.12
  csv: ^6.0.0
  intl: ^0.19.0
  file_saver: ^0.2.8
  uuid: ^4.4.0

  # ── Phase 2: Invoice / Receipt PDF ──────────────────────────────────────
  pdf: ^3.11.1              # PDF generation
  share_plus: ^10.0.0       # OS share sheet (share PDF / other files)
  path_provider: ^2.1.4     # Temp directory for saving PDF before sharing

  # Feature 10: Privacy Policy / Terms WebView
  # Pinned to ^4.8.0 — last release compatible with Dart SDK 3.4.x
  # (4.9.0+ requires Dart >=3.5.0)
  webview_flutter: ^4.8.0

  # Feature 11: Offline / No Internet Handling
  # connectivity_plus 6.x supports Dart >=3.3.0 — works with 3.4.3
  connectivity_plus: ^6.0.0
  # hive_flutter 1.1.0 supports Dart >=2.12.0 — works with 3.4.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true